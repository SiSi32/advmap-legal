<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ADVMAP</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    max-width: 560px;
    margin: 0 auto;
    padding: 64px 20px 48px;
    line-height: 1.6;
    color: #1a1a1a;
    background: #fafafa;
    text-align: center;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #eaeaea; background: #111214; }
    .card { background: #1a1c1f; border-color: #2a2d31; }
    .tag { color: #9aa0a6; }
  }
  .mark {
    width: 84px;
    height: 84px;
    margin: 0 auto 20px;
    border-radius: 20px;
    background: linear-gradient(135deg, #ff7a1a, #e0451a);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, serif;
    font-weight: 700;
    font-size: 32px;
    color: #fff;
    letter-spacing: -1px;
  }
  h1 { font-size: 1.7rem; margin: 0 0 4px; letter-spacing: -0.5px; }
  .tag { color: #666; font-size: 0.95rem; margin: 0 0 36px; }
  .card {
    text-align: left;
    background: #fff;
    border: 1px solid #e6e6e6;
    border-radius: 12px;
    padding: 8px;
    margin-bottom: 16px;
  }
  a.row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    text-decoration: none;
    color: inherit;
    font-weight: 600;
    font-size: 0.95rem;
    border-radius: 8px;
  }
  a.row:hover { background: rgba(127,127,127,0.08); }
  a.row span.arrow { color: #999; font-weight: 400; }
  footer { margin-top: 32px; font-size: 0.8rem; color: #999; }
</style>
</head>
<body>
  <div class="mark">A</div>
  <h1>ADVMAP</h1>
  <p class="tag">Partage et découvre des traces moto / trail GPX</p>

  <div class="card">
    <a class="row" href="./privacy.html">Politique de confidentialité <span class="arrow">→</span></a>
  </div>
  <div class="card">
    <a class="row" href="mailto:advmap@sisilab.app">Support &amp; contact <span class="arrow">→</span></a>
  </div>

  <footer>ADVMAP — SiSiLab</footer>
</body>
</html>
