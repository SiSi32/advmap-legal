<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;

    align-items: center;

    margin: 0;
    padding: 32px 20px;
    line-height: 1.6;
    color: #17181a;
    background: #f5f5f4;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #eceef0; background: #0e0f11; }
    .card { background: #1a1b1e; border-color: #2a2c30; }
    .row:hover, .row:active { background: rgba(255,255,255,0.05); }
    .tag { color: #9aa0a6; }
    .arrow { color: #6b7075; }
    footer { color: #6b7075; }
  }
  main { width: 100%; max-width: 400px; text-align: center; }
  .mark {
    width: 76px;
    height: 76px;
    margin: 0 auto 22px;
    border-radius: 20px;
    background: linear-gradient(150deg, #ff8a3d, #e0451a);
    box-shadow: 0 8px 24px -8px rgba(224, 69, 26, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mark svg { width: 38px; height: 38px; }
  h1 {

    font-weight: 800;
    margin: 0 0 6px;
    letter-spacing: -0.4px;

  .tag {
    color: #6b7075;
    font-size: 0.95rem;
    margin: 0 0 32px;
  }
  .card {
    text-align: left;
    background: #ffffff;
    border: 1px solid #e8e8e7;
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  a.row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 14px;
    text-decoration: none;
    color: inherit;
    border-radius: 10px;
    transition: background-color 0.12s ease;
  }
  .row:hover { background: rgba(0,0,0,0.035); }
  .row-icon {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: rgba(224, 69, 26, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .row-icon svg { width: 17px; height: 17px; stroke: #e0451a; }
  .row-text { flex: 1; }
  .row-title { font-weight: 600; font-size: 0.95rem; }
  .row-sub { font-size: 0.8rem; color: #8a8f94; margin-top: 1px; }
  .arrow { color: #b5b8bb; flex-shrink: 0; }
  footer {
    margin-top: 28px;
    font-size: 0.78rem;
    color: #a3a7ab;
  }
